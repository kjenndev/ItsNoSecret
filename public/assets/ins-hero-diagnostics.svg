<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Calm service path diagnostic panel</title>
  <desc id="desc">A restrained diagnostic summary panel with a magnifying-glass security watermark and three service path rows.</desc>
  <defs>
    <linearGradient id="panel" x1="80" y1="40" x2="640" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#10243B"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <linearGradient id="accent" x1="96" y1="88" x2="648" y2="424" gradientUnits="userSpaceOnUse"><stop stop-color="#38D6FF"/><stop offset="1" stop-color="#2EE6A6"/></linearGradient>
  </defs>
  <rect x="54" y="46" width="652" height="428" rx="42" fill="url(#panel)" stroke="#20354F" stroke-width="2"/>
  <circle cx="572" cy="146" r="86" fill="none" stroke="url(#accent)" stroke-width="24" opacity=".20"/>
  <path d="M632 205 690 263" stroke="#38D6FF" stroke-width="24" stroke-linecap="round" opacity=".16"/>
  <text x="106" y="124" fill="#78EAD8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="600" letter-spacing="4">SERVICE PATH</text>
  <text x="106" y="178" fill="#F8FBFF" font-family="IBM Plex Sans, Inter, sans-serif" font-size="42" font-weight="700">Clear answers before the fix.</text>
  <g font-family="IBM Plex Sans, Inter, sans-serif">
    <g transform="translate(106 230)"><circle cx="23" cy="23" r="22" fill="#10243B" stroke="#38D6FF"/><path d="M14 23l7 7 14-16" fill="none" stroke="#2EE6A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="20" fill="#F8FBFF" font-size="24" font-weight="700">Discover</text><text x="62" y="50" fill="#B9C7D8" font-size="18">Listen, inspect, and identify the root cause.</text></g>
    <g transform="translate(106 310)"><circle cx="23" cy="23" r="22" fill="#10243B" stroke="#38D6FF"/><path d="M14 23l7 7 14-16" fill="none" stroke="#2EE6A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="20" fill="#F8FBFF" font-size="24" font-weight="700">Clarify</text><text x="62" y="50" fill="#B9C7D8" font-size="18">Share a clear plan before repair decisions.</text></g>
    <g transform="translate(106 390)"><circle cx="23" cy="23" r="22" fill="#10243B" stroke="#2EE6A6"/><path d="M14 23l7 7 14-16" fill="none" stroke="#2EE6A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="20" fill="#F8FBFF" font-size="24" font-weight="700">Resolve</text><text x="62" y="50" fill="#B9C7D8" font-size="18">Fix the issue and verify the system is ready.</text></g>
  </g>
</svg>
